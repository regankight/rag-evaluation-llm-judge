name: tests

on:
  push:
  pull_request:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (tags can be moved); the tag is noted for humans.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Offline by design: no API key, judge or dataset download needed.
      - run: make reproduce
