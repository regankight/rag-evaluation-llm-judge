[project]
name = "rag-evaluation-llm-judge"
version = "0.1.0"
description = "Which RAG evaluation can you trust? String matching vs an LLM judge (RAGAS) vs blind human review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "openai>=3.3,<4",
    "ragas==0.4.3",
    # RAGAS 0.4.3 does not pin LangChain; langchain-community 0.4.2 removed a module
    # RAGAS imports, so `import ragas` crashes. See docs/decisions/0002.
    "langchain-community==0.4.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "bm25s>=0.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Report-building f-strings: wrapping them would make the generated Markdown harder to read in source.
"analyze.py" = ["E501"]
